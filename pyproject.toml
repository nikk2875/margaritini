[project]
name = "margaritini"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
# B008: FastAPI dependencies are declared as default arguments.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# S101: assertions are the point of the test suite.
"backend/tests/*" = ["S101"]

[tool.mypy]
files = ["backend/app"]
mypy_path = ["backend"]
strict = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
